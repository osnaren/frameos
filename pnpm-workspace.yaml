packages:
  - apps/*
  - packages/*

catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^6.0.3
  eslint: ^10.14.0
  prettier: ^3.9.10
  '@types/react': ^19.3.0

allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@eslint/eslintrc@3.3.6'
  - '@eslint/js@9.39.5'
  - eslint@9.39.5
overrides:
  js-yaml: '>=3.15.0'
  smol-toml: '>=1.6.1'
  uuid: '>=11.1.1'
  '@tanstack/react-router': 1.170.46
