packages:
  - apps/*
  - packages/*

catalog:
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: ^5.9.3
  eslint: ^9.39.5
  prettier: ^3.9.5
  '@types/react': ^19.2.17

allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@eslint/eslintrc@3.3.6'
  - '@eslint/js@9.39.5'
  - eslint@9.39.5
overrides:
  js-yaml: '>=3.15.0'
  smol-toml: '>=1.6.1'
  uuid: '>=11.1.1'
  '@tanstack/react-router': 1.170.17
